<div>
    <input type="text" (input)="changeFilterName($event)" placeholder="Filter by name" />
</div>

<br>

<table>
    @for (product of filteredProducts(); track $index) {
        <tr>
            <td>{{ product.id }}</td>
            <td>{{ product.name }}</td>
            <td>{{ product.price }}</td>
        </tr>
    }
   
</table>
